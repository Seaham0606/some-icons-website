<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Some Icons — Free SVG Icon Library</title>

    <meta name="description" content="Browse, customize, and download free SVG icons. Search by category, apply custom colors, copy React snippets, and export as SVG or PNG." />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />

    <link rel="canonical" href="https://someicons.com/" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Some Icons" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="Some Icons — Free SVG Icon Library" />
    <meta property="og:description" content="Browse, customize, and download free SVG icons. Search by category, apply custom colors, copy React snippets, and export as SVG or PNG." />
    <meta property="og:url" content="https://someicons.com/" />
    <meta property="og:image" content="https://icons.someicons.com/assets/images/social-banner.jpg" />
    <meta property="og:image:secure_url" content="https://icons.someicons.com/assets/images/social-banner.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1920" />
    <meta property="og:image:height" content="1080" />
    <meta property="og:image:alt" content="Some Icons — a free SVG icon library with search, color customization, and export tools" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Some Icons — Free SVG Icon Library" />
    <meta name="twitter:description" content="Browse, customize, and download free SVG icons. Search by category, apply custom colors, copy React snippets, and export as SVG or PNG." />
    <meta name="twitter:image" content="https://icons.someicons.com/assets/images/social-banner.jpg" />
    <meta name="twitter:image:alt" content="Some Icons — a free SVG icon library with search, color customization, and export tools" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Some Icons",
        "url": "https://someicons.com",
        "description": "Browse, customize, and download free SVG icons. Search by category, apply custom colors, copy React snippets, and export as SVG or PNG.",
        "applicationCategory": "DesignApplication",
        "operatingSystem": "Any",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
    
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-JNWWFMCPD8"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-JNWWFMCPD8');
    </script>
    
    <!--
      Match Zustand persist key `some-icons-ui`: default / `system` → OS appearance;
      saved `light` | `dark` → manual override. Prevents flash before JS loads.
    -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('some-icons-ui');
          var preference = 'system';
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed.state && (parsed.state.theme === 'light' || parsed.state.theme === 'dark' || parsed.state.theme === 'system')) {
              preference = parsed.state.theme;
            }
          } else {
            var legacy = localStorage.getItem('theme');
            if (legacy === 'light' || legacy === 'dark') {
              preference = legacy;
            }
          }
          var effective =
            preference === 'system'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : preference;
          document.documentElement.setAttribute('data-theme', effective);
        } catch (e) {
          document.documentElement.setAttribute(
            'data-theme',
            window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          );
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
